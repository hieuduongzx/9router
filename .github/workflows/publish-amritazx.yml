name: Build & Push amritazx/9router

on:
  workflow_dispatch:
    inputs:
      push_latest:
        description: "Also push :latest tag"
        required: false
        default: true
        type: boolean
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "gitbook/**"
      - "docs/**"

concurrency:
  group: publish-amritazx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    name: Build & Push Docker Image (linux/amd64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read app version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building amritazx/9router:${VERSION}"

      - name: Setup Node.js to generate package-lock.json
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ensure package-lock.json exists
        run: |
          if [ ! -f package-lock.json ]; then
            echo "Generating package-lock.json for Docker npm ci..."
            npm install --package-lock-only --no-audit --no-fund --ignore-scripts
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            amritazx/9router:${{ steps.meta.outputs.version }}
            amritazx/9router:latest
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=amritazx-9router-amd64
          cache-to: type=gha,mode=max,scope=amritazx-9router-amd64
          provenance: false
          sbom: false

      - name: Smoke-test built image
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -Eeuo pipefail
          container="9router-smoke-${GITHUB_RUN_ID}"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT

          docker run --detach \
            --name "$container" \
            --publish 20128:20128 \
            "amritazx/9router:${VERSION}"

          for attempt in {1..45}; do
            if curl --fail --silent --show-error http://127.0.0.1:20128/api/health; then
              echo ""
              echo "Health check passed!"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed; container logs:" >&2
          docker logs "$container" || true
          exit 1

      - name: Check Docker Hub credentials
        id: dockerhub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::DOCKERHUB_TOKEN secret is not set. Image built and smoke-tested successfully, skipping Docker Hub push."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'amritazx' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: steps.dockerhub.outputs.configured == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUSH_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.push_latest }}
        run: |
          set -euo pipefail
          docker push "amritazx/9router:${VERSION}"
          if [ "$PUSH_LATEST" = "true" ]; then
            docker push "amritazx/9router:latest"
          fi

      - name: Summary
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          CONFIGURED: ${{ steps.dockerhub.outputs.configured }}
          PUSH_LATEST: ${{ github.event_name != 'workflow_dispatch' || inputs.push_latest }}
        run: |
          {
            echo "### amritazx/9router Docker Build"
            echo "- Version: \`${VERSION}\`"
            echo "- Health check: PASSED"
            if [ "$CONFIGURED" = "true" ]; then
              echo "- Pushed: \`amritazx/9router:${VERSION}\`"
              if [ "$PUSH_LATEST" = "true" ]; then
                echo "- Pushed: \`amritazx/9router:latest\`"
              fi
            else
              echo "- Push: **Skipped** (set \`DOCKERHUB_TOKEN\` secret in repository settings, then re-run this workflow)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
